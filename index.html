<!-- VALIDATION SCRIPT -->
<script>
$(document).ready(function(){

function validateField(id, regex, errorId){
    let val = $(id).val().trim();
    if(!regex.test(val)){
        $(id).addClass("invalid").removeClass("valid");
        $(errorId).show();
        return false;
    } else {
        $(id).addClass("valid").removeClass("invalid");
        $(errorId).hide();
        return true;
    }
}

/* VALIDATIONS */
$("#last_name, #first_name").on("input", function(){
    validateField(this, /^[A-Za-z]+$/, "#" + this.id + "Error");
});

$("#middle_initial").on("input", function(){
    let val = $(this).val();
    if(val=="" || /^[A-Za-z]$/.test(val)){
        $(this).addClass("valid").removeClass("invalid");
        $("#middleError").hide();
    } else {
        $(this).addClass("invalid").removeClass("valid");
        $("#middleError").show();
    }
});

$("#contact").on("input", function(){
    validateField("#contact", /^(09\d{9}|63\d{10})$/, "#contactError");
});

$("#email").on("input", function(){
    validateField("#email", /^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[a-z]{2,4}$/, "#emailError");
});

$("#birthday").on("change", function(){
    let bday = new Date($(this).val());
    let today = new Date();
    if(bday > today){
        $(this).addClass("invalid").removeClass("valid");
        $("#birthdayError").show();
    } else {
        $(this).addClass("valid").removeClass("invalid");
        $("#birthdayError").hide();
    }
});

/* FORM SUBMIT VALIDATION */
$("#personalForm").on("submit", function(e){
    let valid = true;

    if($("#gender").val() == ""){ $("#genderError").show(); valid=false; }
    if($("#civil").val() == ""){ $("#civilError").show(); valid=false; }
    if($("#address").val().trim() == ""){ $("#addressError").show(); valid=false; }

    if(!valid) e.preventDefault();
});
});
</script>
</head>

<h2>Personal Information</h2>

<form id="personalForm" action="display.php" method="POST">

<div class="form-group">
    <input type="text" id="last_name" name="last_name" placeholder=" ">
    <label>Last Name</label>
    <div class="error" id="last_nameError">Letters only</div>
</div>

    <div class="error" id="first_nameError">Letters only</div>
</div>

<div class="form-group">
    <input type="text" id="middle_initial" name="middle_initial" placeholder=" ">
    <label>Middle Initial (optional)</label>
    <div class="error" id="middleError">Single letter only</div>
</div>

<div class="form-group">
    <select id="gender" name="gender">
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
    </select>
    <label>Gender</label>
    <div class="error" id="genderError">Required</div>
</div>

<div class="form-group">
    <input type="date" id="birthday" name="birthday" placeholder=" ">
    <label>Birthday</label>
    <div class="error" id="birthdayError">Invalid date</div>
</div>

<div class="form-group">
    <input type="text" id="contact" name="contact" placeholder=" ">

</div>

<div class="form-group">
    <input type="email" id="email" name="email" placeholder=" ">

</div>

<div class="form-group">

        <option value="">Select Civil Status</option>

    </select>

</div>

<div class="form-group">
    <textarea id="address" name="address" placeholder=" "></textarea>

</form>
